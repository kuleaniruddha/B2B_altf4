<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Smart Civic Mumbai — Official BMC Admin Control Panel" />
    <meta name="theme-color" content="#e65100" />
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <title>Smart Civic Mumbai — Admin Panel</title>

    <!-- Favicon via SVG data URI -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23e65100'/%3E%3Cpath d='M4 12l12-9 12 9v15a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2z' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3Cpath d='M12 29V20h8v9' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E" />

    <style>
      @font-face {
        font-family: 'Google Sans';
        src:
          local('Google Sans'),
          local('Google Sans Text'),
          local('GoogleSans-Regular'),
          local('Product Sans');
        font-weight: 400;
      }

      @font-face {
        font-family: 'Google Sans';
        src:
          local('Google Sans Medium'),
          local('Google Sans Text Medium'),
          local('GoogleSans-Medium'),
          local('Product Sans Medium');
        font-weight: 500;
      }

      @font-face {
        font-family: 'Google Sans';
        src:
          local('Google Sans Bold'),
          local('Google Sans Text Bold'),
          local('GoogleSans-Bold'),
          local('Product Sans Bold');
        font-weight: 700;
      }

      /* Prevent flash of unstyled content */
      html {
        background-color: #eef2f8;
      }
      html[data-theme="dark"] {
        background-color: #080d1a;
      }
      body { margin: 0; opacity: 0; transition: opacity .15s ease; }
      body.ready { opacity: 1; }
    </style>
    <script>
      (function() {
        try {
          var saved = localStorage.getItem('theme');
          var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
          document.documentElement.setAttribute('data-theme', theme);
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
    <script>
      // Reveal body only after fonts + first paint
      document.fonts.ready.then(() => {
        document.body.classList.add('ready');
      });
      // Fallback: reveal after 400ms regardless
      setTimeout(() => document.body.classList.add('ready'), 400);
    </script>
  </body>
</html>
