name: citizen_app
description: Smart Civic – Mobile App for Civic Issue Reporting
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  firebase_core: ^3.1.1
  firebase_auth: ^5.1.2
  cloud_firestore: ^5.1.0

  cupertino_icons: ^1.0.8
  http: ^1.6.0
  shared_preferences: ^2.2.2
  image_picker: ^1.2.1
  geolocator: ^12.0.0
  intl: ^0.20.2
  firebase_storage: ^12.1.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  provider: ^6.1.5+1
  animations: ^2.1.1
  lucide_icons: ^0.257.0
  record: ^6.2.0
  audioplayers: ^6.1.0
  path_provider: ^2.1.2
  mailer: ^6.3.2
  pdf: ^3.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true